[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
junit = "4.13.2"
kotlinxCoroutinesTest = "1.9.0"
hilt = "2.52"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigation = "2.8.4"
hiltNavigationCompose = "1.2.0"
composeBom = "2024.12.01"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
datastore = "1.1.1"
documentfile = "1.0.1"
securityCrypto = "1.1.0-alpha06"
# JNA (Java Native Access) — desktop-only, used by :desktopApp to call into Windows DPAPI
# (Crypt32 CryptProtectData/CryptUnprotectData via jna-platform's Crypt32Util helper) so the
# stored Internet Archive password/cookies are encrypted at rest, scoped to the current Windows
# user account. jna-platform transitively pulls in jna itself. 5.14.0 is a current stable release.
jna = "5.14.0"
# Compose Multiplatform (JetBrains) — the Desktop UI stack for :desktopApp (Phase 3a of the
# Windows port). 1.7.3 is the stable line built against Kotlin 2.1.0 (matches our kotlin pin),
# and it bundles its own Compose compiler, so :desktopApp does NOT apply org.jetbrains.kotlin.plugin.compose.
composeMultiplatform = "1.7.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# Plain-JVM coroutines core — the COMMON coroutine dependency of the :shared KMP module's commonMain.
# The androidTarget swaps in the -android artifact transitively at runtime; the jvm/desktop target uses
# this directly. Keeps the pure engine free of any Android coroutine variant.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto-ktx", version.ref = "securityCrypto" }
# jna-platform bundles JNA core + the prebuilt Windows Crypt32 mapping (Crypt32Util.cryptProtectData /
# cryptUnprotectData) — no manual JNA interface mapping needed. Desktop-only (:desktopApp).
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Android library plugin — applied by the :shared KMP module's androidTarget() so :app can consume it
# as an Android library (AAR/variant-aware metadata).
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Plain Kotlin/JVM — the :desktopApp headless module (Phase 2 Windows port). Same kotlin version as
# everything else; declared apply-false at the root so the plugin lands on the classpath once.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Kotlin Multiplatform — the :shared module (pure download engine in commonMain, android + jvm targets).
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Compose Multiplatform Gradle plugin — applied by :desktopApp to turn the plain Kotlin/JVM proof
# module into a real Compose Desktop app. Declared apply-false at the root (same one-version-on-the-
# classpath pattern as the other plugins) and applied WITHOUT a version in :desktopApp.
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
